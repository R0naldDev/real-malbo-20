<script>
// ═══════════════════════════════════════════
// CONFIG — Cambia estos valores para tu club
// ═══════════════════════════════════════════
const CLUB_ID  = '483418';
const PLATFORM = 'common-gen5';
const CREST    = 'https://eafc24.content.easports.com/fifa/fltOnlineAssets/24B23FDE-7835-41C2-87A2-F453DFDB2E82/2024/fcweb/crests/256x256/l22.png';

// Proxy path — apunta a nuestra propia API serverless en Vercel
const PROXY = '/api/ea-proxy';

// ═══════════════════════════════════════════
// API CALLS via our Vercel proxy
// ═══════════════════════════════════════════
async function eaFetch(endpoint, params = {}) {
  // En lugar de pasar el endpoint como variable de query ?endpoint=...
  // lo enviamos limpio para evitar codificación de caracteres
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${PROXY}?endpoint=${endpoint}&${qs}`);
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}

async function fetchAllData() {
  const calls = {
    club:    eaFetch('clubs/info',          { clubIds: CLUB_ID, platform: PLATFORM }),
    season:  eaFetch('clubs/seasonalStats', { clubIds: CLUB_ID, platform: PLATFORM }),
    members: eaFetch('members/stats',       { clubId: CLUB_ID,  platform: PLATFORM }),
    career:  eaFetch('members/career/stats',{ clubId: CLUB_ID,  platform: PLATFORM }),
    matches: eaFetch('clubs/matches',       { clubIds: CLUB_ID, platform: PLATFORM, matchType: 'leagueMatch' })
  };

  const results = {};
  const errors  = [];

  for (const [k, promise] of Object.entries(calls)) {
    try { results[k] = await promise; }
    catch { errors.push(k); results[k] = null; }
  }
  return { results, errors };
}

// ═══════════════════════════════════════════
// DATA HELPERS
// ═══════════════════════════════════════════
const dig = (d) => d ? (d[CLUB_ID] || Object.values(d)[0] || d) : null;
const arr = (d) => {
  if (!d) return [];
  if (Array.isArray(d)) return d;
  const v = d[CLUB_ID] || Object.values(d)[0];
  return v?.members || (Array.isArray(v) ? v : []);
};
const ini = n => n ? n.slice(0,2).toUpperCase() : '??';
const posMap = {0:'GK',1:'RB',2:'LB',3:'CB',4:'CB',5:'CDM',6:'CM',7:'CAM',8:'LM',9:'RM',10:'ST',11:'LW',12:'RW',13:'CF',14:'RWB',15:'LWB'};
const posLabel = p => posMap[p] || p || 'MID';
const posCat = p => {
  if (['ST','CF','RW','LW','LF','RF','FW'].includes(p)) return 'FW';
  if (['CM','CAM','CDM','LM','RM','MID'].includes(p)) return 'MID';
  if (['CB','RB','LB','RWB','LWB','DEF'].includes(p)) return 'DEF';
  return p === 'GK' ? 'GK' : 'MID';
};
const posName = c => ({FW:'Delantero',MID:'Mediocampista',DEF:'Defensa',GK:'Portero'}[c]||'Jugador');

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render({ results, errors }) {
  const club = dig(results.club);
  const season = dig(results.season);
  const s = club || season || {};

  const members = arr(results.members).length ? arr(results.members) : arr(results.career);
  const rawMatches = results.matches;

  const wins = +(s.wins||s.winsGamemodesCount||0), losses = +(s.losses||s.lossesGamemodesCount||0), ties = +(s.ties||s.tiesGamemodesCount||0);
  const total = wins+losses+ties || +(s.gamesPlayed||0);
  const wr = total ? (wins/total*100).toFixed(1) : '0';
  const gf = +(s.goals||s.goalsGamemodesCount||0), ga = +(s.goalsAgainst||s.goalsAgainstGamemodesCount||0), gd = gf-ga;
  const name = s.name||'Real Malbo 20';
  const sr = s.skillRating||'—', div = s.currentDivision||'—', bestDiv = s.bestDivision||div;
  const promo = +(s.promotions||0), releg = +(s.relegations||0);

  const players = members.map(m => ({
    name: m.name||m.blazeId||m.persona||'?',
    pos: posLabel(m.favoritePosition??m.proPos),
    goals: +(m.goals||0), assists: +(m.assists||0),
    apps: +(m.gamesPlayed||m.memberGamesPlayed||0),
    rating: parseFloat(m.ratingAve||m.rating||0).toFixed(1),
    motm: +(m.manOfTheMatch||0)
  })).sort((a,b) => b.rating-a.rating);

  const topG = [...players].sort((a,b)=>b.goals-a.goals).slice(0,5);
  const topA = [...players].sort((a,b)=>b.assists-a.assists).slice(0,5);
  const topR = [...players].sort((a,b)=>b.rating-a.rating).slice(0,5);
  const topM = [...players].sort((a,b)=>b.motm-a.motm).slice(0,5);

  // Parse matches
  let matchList = [];
  if (rawMatches) {
    const mArr = Array.isArray(rawMatches) ? rawMatches : (rawMatches[CLUB_ID] || Object.values(rawMatches)[0] || []);
    if (Array.isArray(mArr)) {
      matchList = mArr.slice(0,10).map(m => {
        const clubs = m.clubs||{};
        const our = clubs[CLUB_ID]||{};
        const oppId = Object.keys(clubs).find(id=>id!==CLUB_ID)||'';
        const opp = clubs[oppId]||{};
        const og = +(our.goals||0), eg = +(opp.goals||0);
        const r = og>eg?'W':og<eg?'L':'D';
        return { ourName:our.details?.name||name, oppName:opp.details?.name||`Club ${oppId}`, og, eg, r, rt:r==='W'?'Victoria':r==='L'?'Derrota':'Empate',
          date: m.timestamp?new Date(+m.timestamp*1000).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric'}):'' };
      });
    }
  }

  const has = club||season||players.length;
  const wP=total?(wins/total*100):0, dP=total?(ties/total*100):0, lP=total?(losses/total*100):0;
  const gpg=total?(gf/total).toFixed(2):'0', gcpg=total?(ga/total).toFixed(2):'0';
  const tpg=players.reduce((s,p)=>s+p.goals,0), tpa=players.reduce((s,p)=>s+p.assists,0);

  const rankC=i=>i===0?'r1':i===1?'r2':i===2?'r3':'';
  const renderTop=(title,emoji,list,fn,cls)=>`<div class="card tc anim"><div class="tct"><span class="em">${emoji}</span>${title}</div><div class="tlist">${list.map((p,i)=>`<div class="ti"><span class="tr ${rankC(i)}">${i+1}</span><div class="tav">${ini(p.name)}</div><div class="tinfo"><div class="tname">${p.name}</div><div class="tpos">${p.pos} · ${p.apps} apps</div></div><span class="tv ${cls}">${fn(p)}</span></div>`).join('')}</div></div>`;

  let h = `<section class="hero" id="inicio">
    <div class="shield-wrap anim"><div class="ring ring1"></div><div class="ring ring2"></div><div class="shield"><img src="${CREST}" alt="${name}"></div></div>
    <h1 class="club-name anim d1">${name}</h1>
    <p class="sub anim d2">EA FC Pro Clubs 2026</p>
    <p class="club-id anim d2">CLUB ID: ${CLUB_ID} · ${PLATFORM.toUpperCase()}</p>
    ${has?`<div class="hero-stats anim d3">
      <div class="hs"><span class="v gold">${sr}</span><span class="l">Skill Rating</span></div>
      <div class="hs"><span class="v">${total}</span><span class="l">Partidos</span></div>
      <div class="hs"><span class="v green">${wins}</span><span class="l">Victorias</span></div>
      <div class="hs"><span class="v">${wr}%</span><span class="l">Win Rate</span></div>
      <div class="hs"><span class="v">${gf}</span><span class="l">Goles</span></div>
      <div class="hs"><span class="v">${gd>=0?'+':''}${gd}</span><span class="l">Dif. Goles</span></div>
    </div>
    <div class="rec-wrap anim d4">
      <div class="rec-bar"><div class="w" style="width:${wP}%"></div><div class="d" style="width:${dP}%"></div><div class="l" style="width:${lP}%"></div></div>
      <div class="rec-lbl"><span><span class="dt" style="background:var(--win)"></span>${wins}W (${wP.toFixed(1)}%)</span><span><span class="dt" style="background:var(--draw)"></span>${ties}D (${dP.toFixed(1)}%)</span><span><span class="dt" style="background:var(--loss)"></span>${losses}L (${lP.toFixed(1)}%)</span></div>
    </div>`:''}
  </section><div class="content"><div class="glow-line"></div>`;

  if (!has) {
    h += `<div class="error-box"><h3>⚠ NO SE PUDIERON OBTENER DATOS</h3><p>La API de EA puede estar caída o el proxy no está desplegado. Asegúrate de hacer deploy en Vercel siguiendo las instrucciones del README.</p></div>`;
  }

  if (has) {
    h += `<section class="section" id="division"><div class="sh"><div class="si">🏆</div><h2 class="st">División</h2><span class="sb">⚡ LIVE</span></div>
    <div class="card div-card anim"><div class="div-vis"><img src="https://media.contentapi.ea.com/content/dam/eacom/fc/pro-clubs/divisioncrest${bestDiv||3}.png" alt="Div"></div>
    <div class="div-info"><h3>Mejor División: ${bestDiv||'—'} · Actual: ${div||'—'}</h3><div class="dm">
    <div class="dmi"><span class="dv">${sr}</span><span class="dl">Skill Rating</span></div>
    <div class="dmi"><span class="dv">${wins}-${ties}-${losses}</span><span class="dl">Record</span></div>
    <div class="dmi"><span class="dv">${total}</span><span class="dl">Partidos</span></div>
    <div class="dmi"><span class="dv">${promo||'—'}</span><span class="dl">Ascensos</span></div>
    <div class="dmi"><span class="dv">${releg||'—'}</span><span class="dl">Descensos</span></div>
    <div class="dmi"><span class="dv">${gd>=0?'+':''}${gd}</span><span class="dl">Dif. Goles</span></div>
    </div></div></div></section>`;

    h += `<section class="section" id="stats"><div class="sh"><div class="si">📊</div><h2 class="st">Estadísticas</h2><span class="sb">⚡ LIVE</span></div>
    <div class="sg">
    <div class="card sc anim"><span class="sv">${gf}</span><span class="sl">Goles a Favor</span><div class="sbar"><div class="sf" style="width:${Math.min(gf/6,100)}%"></div></div></div>
    <div class="card sc anim d1"><span class="sv">${ga}</span><span class="sl">Goles en Contra</span><div class="sbar"><div class="sf" style="width:${Math.min(ga/6,100)}%"></div></div></div>
    <div class="card sc anim d2"><span class="sv">${gd>=0?'+':''}${gd}</span><span class="sl">Diferencia</span><div class="sbar"><div class="sf" style="width:${Math.min(Math.abs(gd)/3,100)}%"></div></div></div>
    <div class="card sc anim d3"><span class="sv">${gpg}</span><span class="sl">Goles/Partido</span><div class="sbar"><div class="sf" style="width:${gpg*25}%"></div></div></div>
    <div class="card sc anim d4"><span class="sv">${gcpg}</span><span class="sl">GC/Partido</span><div class="sbar"><div class="sf" style="width:${gcpg*25}%"></div></div></div>
    <div class="card sc anim d5"><span class="sv">${tpg}</span><span class="sl">Goles Plantilla</span><div class="sbar"><div class="sf" style="width:80%"></div></div></div>
    <div class="card sc anim"><span class="sv">${tpa}</span><span class="sl">Asist. Plantilla</span><div class="sbar"><div class="sf" style="width:70%"></div></div></div>
    <div class="card sc anim d1"><span class="sv">${players.length}</span><span class="sl">Jugadores</span><div class="sbar"><div class="sf" style="width:${players.length*10}%"></div></div></div>
    </div></section>`;
  }

  if (matchList.length) {
    h += `<section class="section" id="partidos"><div class="sh"><div class="si">⚽</div><h2 class="st">Últimos Partidos</h2><span class="sb">⚡ LIVE</span></div><div class="ml">`;
    matchList.forEach((m,i) => {
      h += `<div class="card mc anim${i<6?' d'+i:''}"><div class="mt"><div class="tl us">${ini(m.ourName)}</div><span class="tn">${m.ourName}</span></div><div class="ms"><span style="color:var(--${m.r==='W'?'win':m.r==='L'?'loss':'draw'})">${m.og}</span> - <span style="color:var(--${m.r==='L'?'win':m.r==='W'?'loss':'draw'})">${m.eg}</span></div><div class="mt away"><span class="tn">${m.oppName}</span><div class="tl">${ini(m.oppName)}</div></div><div class="mm"><span class="mr ${m.r}">${m.rt}</span><div class="md">${m.date}</div></div></div>`;
    });
    h += `</div></section>`;
  }

  if (players.length) {
    h += `<section class="section" id="jugadores"><div class="sh"><div class="si">👥</div><h2 class="st">Plantilla</h2><span class="sb">${players.length} JUGADORES</span></div><div class="pg">`;
    players.forEach((p,i) => {
      const c = posCat(p.pos);
      h += `<div class="card pc anim${i<8?' d'+(i%6):''}"><div class="ph"><span class="prb">${p.rating}</span><span class="pp ${c}">${p.pos}</span><div class="pa">${ini(p.name)}</div><div class="pn">${p.name}</div><div class="pr">${posName(c)}</div></div><div class="psr"><div class="ps"><span class="psv">${p.apps}</span><span class="psl">Apps</span></div><div class="ps"><span class="psv" style="color:var(--mg)">${p.goals}</span><span class="psl">Goles</span></div><div class="ps"><span class="psv" style="color:var(--cy)">${p.assists}</span><span class="psl">Asist</span></div><div class="ps"><span class="psv">${p.rating}</span><span class="psl">Rating</span></div></div><div class="pmm">⭐ ${p.motm} MOTM</div></div>`;
    });
    h += `</div></section>`;

    h += `<section class="section" id="top"><div class="sh"><div class="si">🥇</div><h2 class="st">Rankings</h2><span class="sb">TOP PLAYERS</span></div><div class="ts">
    ${renderTop('TOP GOLEADORES','⚽',topG,p=>p.goals,'g')}
    ${renderTop('TOP ASISTIDORES','🎯',topA,p=>p.assists,'a')}
    ${renderTop('TOP RATED','⭐',topR,p=>p.rating,'r')}
    </div><div style="margin-top:16px">${renderTop('TOP MAN OF THE MATCH','🏅',topM,p=>p.motm,'r')}</div></section>`;
  }

  h += `<footer class="footer"><p><span class="brand">${name.toUpperCase()}</span> — EA FC Pro Clubs 2026</p>
  <p style="margin-top:6px;opacity:.5">Club ID: ${CLUB_ID} · API de EA via Vercel Proxy · Actualizado: ${new Date().toLocaleString('es')}</p>
  <p style="margin-top:4px;opacity:.3;font-size:.55rem">Proyecto no oficial. No afiliado con EA Sports.</p></footer></div>`;

  document.getElementById('app').innerHTML = h;
  const obs = new IntersectionObserver(e=>{e.forEach(el=>{if(el.isIntersecting)el.target.style.animationPlayState='running'})},{threshold:.1});
  document.querySelectorAll('.anim').forEach(el=>{el.style.animationPlayState='paused';obs.observe(el)});
}

// ═══════════════════════════════════════════
// LOAD & REFRESH
// ═══════════════════════════════════════════
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  
  try {
    // Llamamos a nuestro proxy (que ahora apunta a proclubs.io)
    const response = await fetch('/api/ea-proxy');
    const data = await response.json();

    // Estructura de datos de ProClubs.io
    // El objeto suele venir como { club: {...}, members: [...], matches: [...] }
    console.log("Datos recibidos:", data);

    // Aquí mapeas los datos a tu diseño
    document.getElementById('clubName').innerText = data.club.name;
    document.getElementById('wins').innerText = data.club.wins;
    // ... etc
    
  } catch (error) {
    console.error("Error cargando Real Malbo 20:", error);
  } finally {
    btn.classList.remove('spinning');
  }
}

// Auto-refresh every 5 min
setInterval(loadData, 5 * 60 * 1000);

// ═══════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════
const cvs=document.getElementById('particles'),ctx=cvs.getContext('2d');
let W,H;function rz(){W=cvs.width=innerWidth;H=cvs.height=innerHeight}rz();addEventListener('resize',rz);
class P{constructor(){this.reset()}reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.s=Math.random()*1.5+.5;this.a=Math.random()*.25+.1;this.c=Math.random()>.5?'0,240,255':'255,0,170'}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.reset()}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle=`rgba(${this.c},${this.a})`;ctx.fill()}}
const pts=Array.from({length:50},()=>new P());
!function a(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.update();p.draw()});requestAnimationFrame(a)}();

// Nav smooth scroll
document.querySelectorAll('.nav-links a').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();document.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:'smooth'})})});
document.getElementById('refreshBtn').addEventListener('click',loadData);

// GO
loadData();
</script>
